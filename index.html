<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1b2a" />
    <meta name="description" content="As aventuras do Raul e do seu cachorro em um jogo de plataforma em pixel art." />
    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Raul's World" />
    <title>Raul's World</title>
    <style>
      :root { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
      html, body { margin: 0; height: 100%; background: #1b1b2a; overflow: hidden; touch-action: none; overscroll-behavior: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; }
      /* como app instalado, o jogo ocupa a altura toda da tela (veja cssSize em src/main.js) */
      @media (display-mode: standalone), (display-mode: fullscreen) { #game { bottom: auto; height: 100vh; } }
      canvas { display: block; image-rendering: pixelated; }
      #update-toast {
        position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); transform: translate(-50%, -150%);
        background: #ffd23f; color: #1b1b2a; font: bold 15px/1.2 "Courier New", monospace; padding: 10px 16px;
        border: 3px solid #1b1b2a; border-radius: 8px; transition: transform .3s ease; z-index: 10; pointer-events: none;
      }
      #update-toast.show { transform: translate(-50%, 0); }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="update-toast">Nova versão! Atualizando…</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
